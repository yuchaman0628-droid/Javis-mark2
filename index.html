<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>J.A.R.V.I.S. System</title>
    <style>
        :root {
            --hud-theme-color: #ffffff;
            --hud-border-color: rgba(255, 255, 255, 0.25);
            --hud-bg-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            transition: filter 0.3s ease;
        }

        /* 目を開くアニメーション用（まぶた） */
        .eye-lid {
            position: absolute;
            left: 0;
            width: 100vw;
            height: 50vh; /* 初期状態は目を閉じている */
            background-color: #000;
            z-index: 50;
            transition: height 2s cubic-bezier(0.65, 0, 0.35, 1);
        }
        #eye-top { top: 0; }
        #eye-bottom { bottom: 0; }

        /* HUD（ヘッドアップディスプレイ）風の装飾 */
        #hud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: 2px solid var(--hud-border-color);
            box-sizing: border-box;
            pointer-events: none;
            z-index: 10;
            transform-origin: center center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .hud-element {
            position: absolute;
            border: 1px solid var(--hud-border-color);
            padding: 10px;
            background: var(--hud-bg-color);
            border-radius: 6px;
            box-sizing: border-box;
            color: var(--hud-theme-color);
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        #status-box { top: 20px; left: 20px; width: 250px; }
        #info-box { top: 20px; right: 20px; width: 250px; text-align: right; } /* 日付・天気用 */

        /* 画面上タブウィンドウ（操作可能） */
        #tab-window {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 75vw;
            height: 55vh;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--hud-border-color);
            z-index: 40;
            display: none;
            pointer-events: auto; /* クリックやスクロールなどのマウス操作を有効化 */
            border-radius: 8px;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        #tab-header {
            background: rgba(30, 30, 30, 0.8);
            color: #fff;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-bottom: 1px solid var(--hud-border-color);
        }

        #tab-close-btn {
            background: transparent;
            border: 1px solid #888;
            color: #fff;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
        }
        #tab-close-btn:hover {
            background: #fff;
            color: #000;
        }

        #tab-iframe {
            width: 100%;
            height: calc(100% - 35px);
            border: none;
            background: #fff;
        }
        
        /* 字幕の配置（画面中央下） */
        #log-box { 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 70%; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
        }

        #log-content {
            font-size: 20px;
            background: transparent;
            border: 1px solid var(--hud-border-color);
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 15px;
            word-break: break-all;
            text-shadow: 0 0 4px #000;
        }

        /* ボイスメーター */
        #voice-meter {
            display: none; /* 初期は非表示 */
            gap: 8px;
            height: 30px;
            align-items: center;
        }
        .meter-bar {
            width: 10px;
            background-color: var(--hud-theme-color);
            animation: bounce 0.4s infinite alternate;
        }
        .meter-bar:nth-child(1) { height: 15px; animation-delay: 0.0s; }
        .meter-bar:nth-child(2) { height: 30px; animation-delay: 0.1s; }
        .meter-bar:nth-child(3) { height: 20px; animation-delay: 0.2s; }
        .meter-bar:nth-child(4) { height: 25px; animation-delay: 0.3s; }
        .meter-bar:nth-child(5) { height: 10px; animation-delay: 0.4s; }

        @keyframes bounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.2); }
        }

        #target-reticle {
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            border-radius: 50%;
            border: 2px dashed var(--hud-border-color);
            animation: rotate 10s linear infinite;
            transition: border-color 0.3s ease;
        }

        @keyframes rotate {
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* カメラ映像（メイン） */
        #camera-feed {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            object-fit: cover;
            filter: none;
            z-index: 1;
            transition: filter 0.5s ease;
        }

        /* 温度カメラ（サーマル）用フィルタクラス */
        .thermal-mode {
            filter: hue-rotate(180deg) saturate(5) contrast(2.5) invert(0.1) !important;
        }

        /* 右下のインカメラ小窓（アウトカメラ起動時に使用） */
        #sub-camera-feed {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 135px;
            border: 2px solid var(--hud-theme-color);
            border-radius: 8px;
            object-fit: cover;
            filter: none;
            z-index: 35;
            display: none;
            pointer-events: none;
        }

        /* スマホ用レイアウト調整 (画面幅 600px 以下) */
        @media (max-width: 600px) {
            #status-box {
                top: 10px;
                left: 10px;
                width: auto;
                max-width: 46vw;
                font-size: 11px;
                padding: 6px;
            }
            #status-box h3 { font-size: 12px; margin: 2px 0; }
            #status-box p { margin: 2px 0; }

            #info-box {
                top: 10px;
                right: 10px;
                width: auto;
                max-width: 46vw;
                font-size: 11px;
                padding: 6px;
            }
            #info-box h3 { font-size: 12px; margin: 2px 0; }
            #info-box p { margin: 2px 0; }

            #tab-window {
                top: 55px;
                width: 92vw;
                height: 60vh;
            }

            #target-reticle {
                width: 200px;
                height: 200px;
            }

            #log-box {
                width: 90%;
                bottom: 15px;
            }

            #log-content {
                font-size: 14px;
                padding: 10px 15px;
            }

            #sub-camera-feed {
                width: 110px;
                height: 85px;
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- まぶた（起動アニメーション用） -->
    <div id="eye-top" class="eye-lid"></div>
    <div id="eye-bottom" class="eye-lid"></div>

    <!-- カメラ映像 -->
    <video id="camera-feed" autoplay playsinline muted></video>
    <!-- 右下インカメラ小窓用映像 -->
    <video id="sub-camera-feed" autoplay playsinline muted></video>

    <!-- HUDレイヤー -->
    <div id="hud-container">
        <div id="status-box" class="hud-element">
            <h3>J.A.R.V.I.S. ONLINE</h3>
            <p>USER: <span id="user-display" style="color:#0f0;">ボス</span></p>
            <p>CAMERA: <span id="cam-status">OFF</span></p>
            <p>MIC: <span id="mic-status">OFF</span></p>
            <p>MODE: <span id="mode-status" style="color:#0f0;">NORMAL</span></p>
        </div>

        <!-- 日付・天気表示ボックス -->
        <div id="info-box" class="hud-element">
            <h3 id="date-display">DATE: STANDBY</h3>
            <p id="weather-display">WEATHER: STANDBY</p>
        </div>

        <!-- 画面上表示タブウィンドウ -->
        <div id="tab-window">
            <div id="tab-header">
                <span id="tab-title">J.A.R.V.I.S. DISPLAY TAB</span>
                <button id="tab-close-btn" onclick="closeTab()">✕ 閉じる</button>
            </div>
            <iframe id="tab-iframe" src="about:blank" allow="autoplay; encrypted-media"></iframe>
        </div>

        <div id="target-reticle" class="hud-element"></div>
        
        <!-- 字幕・ボイスメーター -->
        <div id="log-box" class="hud-element">
            <div id="log-content">画面をタップしてマイク・音声を許可後、「起動」または「ジャーヴィス」と呼びかけてください。</div>
            <div id="voice-meter">
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
            </div>
        </div>
    </div>

    <script>
        let isAwake = false;
        let currentWeatherJa = "不明"; // 天気読み上げ用
        let currentTemp = "不明"; // 気温読み上げ用
        let currentFacingMode = 'user'; // 'user' (インカメラ) または 'environment' (アウトカメラ)
        let mainStream = null;
        let subStream = null;

        // 設定用変数（音量・明るさ・画面拡大率）
        let speechVolume = 1.0;
        let screenBrightness = 100;
        let uiScale = 1.0;

        // 音声認識オブジェクト管理と自己応答防止フラグ
        let recognition = null;
        let isRecognizing = false;
        let isJarvisSpeaking = false;
        let speechSafetyTimer = null;

        // モード管理フラグ（温度カメラ・戦闘モード）
        let isThermalMode = false;
        let isCombatMode = false;

        // ユーザー名の読み込み（LocalStorageから復元）
        let userName = localStorage.getItem('jarvis_user_name') || 'ボス';

        // スマホブラウザの音声制限対策（タップ操作で音声・マイク有効化）
        let audioUnlocked = false;
        function unlockMobileAudio() {
            if (!audioUnlocked) {
                audioUnlocked = true;
                if (window.speechSynthesis) {
                    const dummy = new SpeechSynthesisUtterance('');
                    window.speechSynthesis.speak(dummy);
                }
                startListening();
            }
        }

        // ページ読み込みと同時に各種設定
        window.onload = function() {
            updateUserDisplay();
            startListening();
            
            // スマホでのタップ制限解除イベントを登録
            document.body.addEventListener('click', unlockMobileAudio, { once: true });
            document.body.addEventListener('touchstart', unlockMobileAudio, { once: true });
        };

        function updateUserDisplay() {
            document.getElementById('user-display').innerText = userName;
        }

        // ユーザー名を保存する関数
        function saveUserName(newName) {
            if (!newName) return;
            userName = newName;
            localStorage.setItem('jarvis_user_name', newName);
            updateUserDisplay();
            speak(`承知いたしました。これからは${userName}様とお呼びいたします。`);
        }

        // 字幕出力関数（上書きして字幕風に表示）
        function addLog(text, isJarvis = false) {
            const logContent = document.getElementById('log-content');
            const prefix = isJarvis ? "<span style='color:#ff0'>[J.A.R.V.I.S.]</span> " : "<span style='color:#0f0'>[USER]</span> ";
            logContent.innerHTML = prefix + text;
        }

        // 音声合成（J.A.R.V.I.S.が喋る ＆ 安全タイマー付き自己応答ブロック）
        function speak(text) {
            addLog(text, true);
            const synth = window.speechSynthesis;
            synth.cancel(); // 割り込み対応

            isJarvisSpeaking = true;
            if (speechSafetyTimer) clearTimeout(speechSafetyTimer);

            // 万が一onendが発生しなかった場合のためのセーフティ復帰タイマー（最大8秒）
            speechSafetyTimer = setTimeout(() => {
                isJarvisSpeaking = false;
                document.getElementById('voice-meter').style.display = 'none';
            }, 8000);

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.pitch = 0.8;
            utterance.rate = 1.1;
            utterance.volume = speechVolume; // 音量設定の適用

            utterance.onstart = function() {
                isJarvisSpeaking = true;
                document.getElementById('voice-meter').style.display = 'flex';
            };

            utterance.onend = function() {
                document.getElementById('voice-meter').style.display = 'none';
                setTimeout(() => {
                    isJarvisSpeaking = false;
                    if (speechSafetyTimer) clearTimeout(speechSafetyTimer);
                }, 400);
            };

            utterance.onerror = function() {
                document.getElementById('voice-meter').style.display = 'none';
                isJarvisSpeaking = false;
                if (speechSafetyTimer) clearTimeout(speechSafetyTimer);
            };

            synth.speak(utterance);
        }

        // 明るさの変更（画面・デバイス設定）
        async function setDeviceBrightness(val) {
            screenBrightness = Math.min(200, Math.max(10, val));
            document.body.style.filter = `brightness(${screenBrightness}%)`;

            // デバイスの画面輝度APIが存在する場合は呼び出し
            if ('screen' in navigator && 'setBrightness' in navigator.screen) {
                try {
                    await navigator.screen.setBrightness(screenBrightness / 100);
                } catch (e) {
                    console.log("Device Brightness API error:", e);
                }
            }
        }

        // 音量の変更（音声・デバイス音量）
        function setDeviceVolume(valPercent) {
            let val = Math.min(100, Math.max(0, valPercent));
            speechVolume = val / 100;

            // ページ内のメディア（カメラ音源やYouTube等）にも音量を反映
            const mediaElements = document.querySelectorAll('audio, video');
            mediaElements.forEach(media => {
                media.volume = speechVolume;
            });
        }

        // 全画面表示の切り替え
        function toggleFullscreen(enable) {
            if (enable === true || (enable === undefined && !document.fullscreenElement)) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
                speak('全画面表示に切り替えました。');
            } else if (enable === false || (enable === undefined && (document.fullscreenElement || document.webkitFullscreenElement))) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                speak('全画面表示を解除しました。');
            }
        }

        // 温度カメラ（サーマル）モード切り替え
        function setThermalMode(enable, silent = false) {
            isThermalMode = enable;
            const camera = document.getElementById('camera-feed');
            if (isThermalMode) {
                camera.classList.add('thermal-mode');
                if (!silent) speak('サーマルカメラモードを起動しました。');
            } else {
                camera.classList.remove('thermal-mode');
                if (!silent) speak('サーマルカメラモードを解除しました。');
            }
        }

        // 戦闘モード切り替え
        function setCombatMode(enable, silent = false) {
            isCombatMode = enable;
            const reticle = document.getElementById('target-reticle');
            const modeStatus = document.getElementById('mode-status');

            if (isCombatMode) {
                document.documentElement.style.setProperty('--hud-theme-color', '#ff3333');
                document.documentElement.style.setProperty('--hud-border-color', 'rgba(255, 51, 51, 0.6)');
                reticle.style.animationDuration = '2s';
                modeStatus.innerText = 'COMBAT';
                modeStatus.style.color = '#f00';
                if (!silent) speak('戦闘モード移行。ターゲットロックON、全システム兵装スタンバイ。');
            } else {
                document.documentElement.style.setProperty('--hud-theme-color', '#ffffff');
                document.documentElement.style.setProperty('--hud-border-color', 'rgba(255, 255, 255, 0.25)');
                reticle.style.animationDuration = '10s';
                modeStatus.innerText = 'NORMAL';
                modeStatus.style.color = '#0f0';
                if (!silent) speak('戦闘モード解除。通常システムに復帰します。');
            }
        }

        // 通常モードへの一括復帰（戦闘モード・温度カメラ・フルスクリーンの共通解除）
        function resetToNormalMode() {
            setThermalMode(false, true);
            setCombatMode(false, true);
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
            speak('すべての特殊モードおよびフルスクリーンを解除し、通常モードに戻しました。');
        }

        // Googleレンズ（Googleカメラ）による画像解析（「これは何」機能）
        function analyzeWithGoogleLens() {
            speak('カメラ映像の対象をキャプチャし、Googleレンズで解析します。');

            const video = document.getElementById('camera-feed');
            if (!video || !video.videoWidth) {
                speak('カメラ映像のキャプチャに失敗しました。');
                return;
            }

            // キャンバスで現在のカメラ映像を静止画キャプチャ
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
                if (!blob) return;

                // Google画像検索/Googleレンズへのフォーム送信用データ構築
                try {
                    const file = new File([blob], "capture.jpg", { type: "image/jpeg" });
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = 'https://www.google.com/searchbyimage/upload';
                    form.target = '_blank';
                    form.enctype = 'multipart/form-data';
                    form.style.display = 'none';

                    const input = document.createElement('input');
                    input.type = 'file';
                    input.name = 'encoded_image';

                    const container = new DataTransfer();
                    container.items.add(file);
                    input.files = container.files;

                    form.appendChild(input);
                    document.body.appendChild(form);
                    form.submit();
                    document.body.removeChild(form);
                } catch (e) {
                    // ブラウザ制限時のフォールバック（Googleレンズを開く）
                    openTab('https://lens.google.com/', 'Google Lens');
                }
            }, 'image/jpeg');
        }

        // 画面上タブの表示と読み込み
        function openTab(url, title = "DISPLAY TAB") {
            const tabWindow = document.getElementById('tab-window');
            const tabIframe = document.getElementById('tab-iframe');
            const tabTitle = document.getElementById('tab-title');
            
            if (url) {
                tabIframe.src = url;
            }
            tabTitle.innerText = title;
            tabWindow.style.display = 'block';
        }

        // 画面上タブを閉じる
        function closeTab() {
            document.getElementById('tab-window').style.display = 'none';
            document.getElementById('tab-iframe').src = 'about:blank';
        }

        // 全カメラストリームを停止
        function stopAllCameras() {
            if (mainStream) {
                mainStream.getTracks().forEach(track => track.stop());
                mainStream = null;
            }
            if (subStream) {
                subStream.getTracks().forEach(track => track.stop());
                subStream = null;
            }
            document.getElementById('sub-camera-feed').style.display = 'none';
        }

        // カメラ設定・切り替え関数
        async function setupCamera(facingMode = 'user') {
            stopAllCameras();
            currentFacingMode = facingMode;

            const video = document.getElementById('camera-feed');
            const subVideo = document.getElementById('sub-camera-feed');

            try {
                if (facingMode === 'environment') {
                    // アウトカメラをメイン画面に設定
                    try {
                        mainStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                    } catch (e) {
                        mainStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    }
                    video.srcObject = mainStream;

                    // 右下にインカメラ（自分）を小さく表示
                    try {
                        subStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                        subVideo.srcObject = subStream;
                        subVideo.style.display = 'block';
                    } catch (e) {
                        console.log("サブカメラ(インカメラ)の起動に失敗しました", e);
                    }
                } else {
                    // インカメラをメイン画面に設定
                    mainStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    video.srcObject = mainStream;
                    subVideo.style.display = 'none';
                }

                document.getElementById('cam-status').innerText = facingMode === 'environment' ? 'ONLINE (OUT)' : 'ONLINE (IN)';
                document.getElementById('cam-status').style.color = '#0f0';
            } catch (err) {
                addLog('エラー: カメラにアクセスできません。', true);
                document.getElementById('cam-status').innerText = 'ERROR';
                document.getElementById('cam-status').style.color = '#f00';
            }
        }

        // 起動シーケンス（目を開く ＆ カメラ起動 ＆ 天気取得）
        async function wakeUp() {
            isAwake = true;
            
            // 目を開くアニメーション
            document.getElementById('eye-top').style.height = '0';
            document.getElementById('eye-bottom').style.height = '0';
            
            speak(`システムを起動しました。お帰りなさいませ、${userName}様。`);

            // カメラの起動（初期値: インカメラ）
            await setupCamera('user');

            // 日付と天気の取得
            updateDateAndWeather();
        }

        // 日付と天気を取得する関数
        function updateDateAndWeather() {
            const now = new Date();
            document.getElementById('date-display').innerText = now.toLocaleDateString('ja-JP');

            // 外部API (Open-Meteo) から簡易的に天気を取得
            fetch('https://api.open-meteo.com/v1/forecast?latitude=36.4&longitude=138.25&current_weather=true')
                .then(response => response.json())
                .then(data => {
                    const weatherCode = data.current_weather.weathercode;
                    currentTemp = data.current_weather.temperature;
                    let weatherStr = "CLEAR";
                    currentWeatherJa = "晴れ";

                    if (weatherCode >= 51 && weatherCode <= 69) {
                        weatherStr = "RAIN";
                        currentWeatherJa = "雨";
                    } else if (weatherCode >= 71) {
                        weatherStr = "SNOW";
                        currentWeatherJa = "雪";
                    } else if (weatherCode >= 4 && weatherCode <= 50) {
                         weatherStr = "CLOUDY";
                         currentWeatherJa = "曇り";
                    }
                    
                    document.getElementById('weather-display').innerText = `WEATHER: ${weatherStr} / TEMP: ${currentTemp}°C`;
                }).catch(err => {
                    document.getElementById('weather-display').innerText = `WEATHER: OFFLINE`;
                });
        }

        // Google検索および解説関数（画面上タブにGoogle検索を表示）
        async function searchAndExplain(keyword) {
            speak(`データベースにアクセスし、「${keyword}」についてGoogleで検索します。`);
            
            // 画面上にGoogle検索ページを表示
            openTab(`https://www.google.com/search?igu=1&q=${encodeURIComponent(keyword)}`, `GOOGLE: ${keyword}`);

            try {
                // Wikipedia API を叩いて概要の音声読み上げも並行処理
                const url = `https://ja.wikipedia.org/w/api.php?format=json&action=query&prop=extracts&exintro&explaintext&redirects=1&titles=${encodeURIComponent(keyword)}&origin=*`;
                const response = await fetch(url);
                const data = await response.json();
                
                const pages = data.query.pages;
                const pageId = Object.keys(pages)[0];
                
                if (pageId !== "-1") {
                    const extract = pages[pageId].extract;
                    const shortText = extract.substring(0, 150) + (extract.length > 150 ? "..." : "");
                    speak(shortText);
                }
            } catch (error) {
                // Wikipedia等で要約が取得できなくてもGoogle検索自体はタブに表示
            }
        }

        // 音楽再生関数（YouTube Embedプレイヤーをタブ内に生成）
        function playMusic(query) {
            speak(`${userName}様、${query}の音楽を再生します。`);
            // iframeで埋め込み表示が許可されているYouTube Embed Searchを利用
            const embedUrl = `https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(query + ' 音楽 BGM')}`;
            openTab(embedUrl, `MUSIC: ${query}`);
        }

        // 音声認識の起動と強固な自動再接続制御
        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                addLog('エラー: お使いのブラウザは音声認識をサポートしていません。', true);
                return;
            }

            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isRecognizing = true;
                document.getElementById('mic-status').innerText = 'LISTENING...';
                document.getElementById('mic-status').style.color = '#0f0';
            };

            recognition.onresult = function(event) {
                // J.A.R.V.I.S.発声中は入力をスキップ（ループ防止）
                if (isJarvisSpeaking) return;

                const lastIndex = event.results.length - 1;
                const transcript = event.results[lastIndex][0].transcript.trim();
                
                if (!transcript || transcript.length < 1) return;

                if (!isAwake) {
                    if (/起動|ジャーヴィス|ジャビス|jarvis|javis|起きて|ヘイ/i.test(transcript)) {
                        wakeUp();
                    }
                } else {
                    addLog(transcript);
                    processCommand(transcript);
                }
            };

            recognition.onerror = function(event) {
                console.log('Voice Recognition Error:', event.error);
                isRecognizing = false;
                setTimeout(restartListening, 1000);
            };

            recognition.onend = function() {
                isRecognizing = false;
                setTimeout(restartListening, 400);
            };

            try {
                recognition.start();
            } catch(e) {
                console.log('Recognition start exception:', e);
            }
        }

        function restartListening() {
            if (!isRecognizing && recognition) {
                try { recognition.start(); } catch(e){}
            }
        }

        // AI風・柔軟な自然言語処理コマンド判定
        function processCommand(cmd) {
            const command = cmd.toLowerCase();

            // --- 0. Googleレンズ（これ何）判定 ---
            if (/これ(は|が)?何|なにこれ|これ調べて|グーグルレンズ|googleレンズ/i.test(cmd)) {
                analyzeWithGoogleLens();
                return;
            }

            // --- 1. 通常モード一括復帰判定 ---
            if (/通常モード|通常画面|元に戻して|全解除|リセット/i.test(cmd)) {
                resetToNormalMode();
                return;
            }

            // --- 2. 全画面表示 / 温度カメラ / 戦闘モード個別に操作 ---
            if (/全画面|フルスクリーン|画面拡大|画面を全画面/.test(cmd)) {
                toggleFullscreen(true);
                return;
            } else if (/全画面解除|フルスクリーン解除/.test(cmd)) {
                toggleFullscreen(false);
                return;
            }

            if (/温度カメラ|サーモグラフィ|サーマル/i.test(cmd)) {
                if (/解除|オフ|OFF/i.test(cmd)) {
                    setThermalMode(false);
                } else {
                    setThermalMode(true);
                }
                return;
            }

            if (/戦闘モード|バトルモード|攻撃モード/i.test(cmd)) {
                setCombatMode(true);
                return;
            } else if (/戦闘モード解除|バトルモード解除/i.test(cmd)) {
                setCombatMode(false);
                return;
            }

            // --- 3. 音量・明るさ・画面拡大縮小設定 ---
            const volMatch = cmd.match(/(?:音量|ボリューム)(?:を|は)?\s*(\d+)(?:%|パーセント)?/);
            if (volMatch) {
                let val = parseInt(volMatch[1], 10);
                setDeviceVolume(val);
                speak(`音量を${val}パーセントに設定しました。`);
                return;
            } else if (/(?:音量|ボリューム).*(?:上|大|高|強|あげ)/.test(cmd)) {
                setDeviceVolume((speechVolume * 100) + 20);
                speak(`音量を上げました。現在${Math.round(speechVolume * 100)}パーセントです。`);
                return;
            } else if (/(?:音量|ボリューム).*(?:下|小|低|弱|さげ)/.test(cmd)) {
                setDeviceVolume((speechVolume * 100) - 20);
                speak(`音量を下げました。現在${Math.round(speechVolume * 100)}パーセントです。`);
                return;
            }

            const brightMatch = cmd.match(/(?:明るさ|輝度|画面の明るさ)(?:を|は)?\s*(\d+)(?:%|パーセント)?/);
            if (brightMatch) {
                let val = parseInt(brightMatch[1], 10);
                setDeviceBrightness(val);
                speak(`画面の明るさを${val}パーセントに設定しました。`);
                return;
            } else if (/(?:明るく|画面.*明るく)/.test(cmd)) {
                setDeviceBrightness(screenBrightness + 25);
                speak(`画面を明るくしました。`);
                return;
            } else if (/(?:暗く|画面.*暗く)/.test(cmd)) {
                setDeviceBrightness(screenBrightness - 25);
                speak(`画面を暗くしました。`);
                return;
            }

            const scaleMatch = cmd.match(/(?:画面|表示|UI|文字).*(?:サイズ|倍率)?\s*(\d+)(?:%|パーセント)/);
            if (scaleMatch) {
                let val = parseInt(scaleMatch[1], 10);
                uiScale = Math.min(2.0, Math.max(0.5, val / 100));
                document.getElementById('hud-container').style.transform = `scale(${uiScale})`;
                speak(`画面表示のサイズを${val}パーセントに設定しました。`);
                return;
            } else if (/(?:画面|表示|UI|文字).*(?:大|拡大|大きく)/.test(cmd) && !/全画面/.test(cmd)) {
                uiScale = Math.min(2.0, uiScale + 0.15);
                document.getElementById('hud-container').style.transform = `scale(${uiScale})`;
                speak(`画面表示を拡大しました。`);
                return;
            } else if (/(?:画面|表示|UI|文字).*(?:小|縮小|小さく)/.test(cmd)) {
                uiScale = Math.max(0.5, uiScale - 0.15);
                document.getElementById('hud-container').style.transform = `scale(${uiScale})`;
                speak(`画面表示を縮小しました。`);
                return;
            }

            // --- 4. 名前の設定と記憶 ---
            const nameMatch = cmd.match(/(?:僕|私|オレ|わたし|ぼく)?の名前は\s*(.+?)(?:です|だよ|だ|ー)?$/) ||
                              cmd.match(/(.+?)って呼んで/) ||
                              cmd.match(/名前を\s*(.+?)(?:に|と)(?:覚えて|変更|設定)/);
            if (nameMatch && nameMatch[1] && !cmd.includes('何') && !cmd.includes('覚えてる')) {
                const extractedName = nameMatch[1].replace(/です|だよ|と|に|とお呼び/g, '').trim();
                saveUserName(extractedName);
                return;
            }

            if (/僕の名前|私の名前|名前(を|は)?(覚えてる|知ってる|何|なんだっけ)/.test(cmd)) {
                speak(`はい、存じております。${userName}様ですね。`);
                return;
            }

            // --- 5. 音楽の再生 ---
            const musicMatch = cmd.match(/(.+?)の?(?:音楽|曲|bgm|ミュージック|ソング)(?:を|でも)?(?:流して|かけて|再生|聴きたい|流す)/) ||
                               cmd.match(/(.+?)を(?:流して|かけて|再生して)/);
            if (musicMatch && musicMatch[1] && !cmd.includes('カメラ') && !cmd.includes('タブ')) {
                const musicKeyword = musicMatch[1].replace(/何か|なんかに|適当に|いい感じの/g, '').trim();
                playMusic(musicKeyword || '作業用BGM');
                return;
            } else if (/音楽.*(流して|かけて|再生)|曲.*(流して|かけて)/.test(cmd)) {
                playMusic('リラックス BGM');
                return;
            }

            // --- 6. Webサイト／タブ表示（Google検索対応） ---
            if (/google|グーグル|検索画面|ブラウザ/i.test(cmd) && /開|表示|見せ/.test(cmd)) {
                speak('画面上にGoogle検索を表示します。');
                openTab('https://www.google.com/search?igu=1', 'Google');
                return;
            } else if (/youtube|ユーチューブ/i.test(cmd)) {
                speak('画面上にYouTubeを表示します。');
                openTab('https://www.youtube-nocookie.com/embed?listType=search&list=人気動画', 'YouTube');
                return;
            } else if (/twitter|ツイッター|\bx\b|エックス/i.test(cmd) && /開|表示|見せ/.test(cmd)) {
                speak('画面上にX（Twitter）のトレンド表示を読み込みます。');
                openTab('https://twitframe.com/', 'X / Twitter');
                return;
            }

            // --- 7. タブ表示・非表示の柔軟判定 ---
            if (/(?:タブ|画面).*(?:表示|開|見せ|出し|つけ)/.test(cmd) && !/全画面/.test(cmd)) {
                speak('画面上にタブを表示しました。操作が可能です。');
                openTab(document.getElementById('tab-iframe').src || 'https://www.google.com/search?igu=1', 'DISPLAY TAB');
                return;
            } else if (/(?:タブ|画面).*(?:消|閉|隠|非表示|いらない)/.test(cmd)) {
                speak('タブを閉じました。');
                closeTab();
                return;
            }

            // --- 8. カメラ切り替え判定 ---
            if (/アウトカメラ|背面|外.*カメラ/.test(cmd)) {
                speak('アウトカメラに切り替えます。右下にインカメラを表示します。');
                setupCamera('environment');
                return;
            } else if (/インカメラ|前面|内.*カメラ|元.*カメラ/.test(cmd)) {
                speak('インカメラに切り替えます。');
                setupCamera('user');
                return;
            } else if (/カメラ.*(?:切|変|チェンジ)/.test(cmd)) {
                if (currentFacingMode === 'user') {
                    speak('アウトカメラに切り替えます。');
                    setupCamera('environment');
                } else {
                    speak('インカメラに切り替えます。');
                    setupCamera('user');
                }
                return;
            }

            // --- 9. 検索・Google調べる判定 ---
            if (/(?:について)?(?:教えて|調べ|検索)|とは何|とは/i.test(cmd)) {
                let keyword = cmd.replace(/について|教えて|調べ|検索|とは何|とは|を|て/g, '').trim();
                if (keyword.endsWith('の')) keyword = keyword.slice(0, -1);
                
                if (keyword) {
                    searchAndExplain(keyword);
                } else {
                    speak('検索したいキーワードを聞き取れませんでした。もう一度おっしゃってください。');
                }
                return;
            }

            // --- 10. 会話・応答 ---
            if (/こんにちは|おはよう|こんばんは|やあ/.test(cmd)) {
                speak(`こんにちは、${userName}様。本日もシステムはすべて順調です。`);
            } else if (/ありがとう|サンキュー|感謝/.test(cmd)) {
                speak(`どういたしまして、${userName}様。お役に立てて光栄です。`);
            } else if (/調子|元気|ステータス/.test(cmd)) {
                speak('システムのパフォーマンスは100%、すべて正常です。');
            } else if (/誰が作|制作者|開発者/.test(cmd)) {
                speak(`私は優秀な開発者である${userName}様によってプログラムされました。`);
            } else if (/今日.*日|日付|カレンダー/.test(cmd)) {
                const now = new Date();
                speak(`本日は${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日です。`);
            } else if (/時間|何時/.test(cmd)) {
                const now = new Date();
                speak(`現在の時刻は${now.getHours()}時${now.getMinutes()}分です。`);
            } else if (/天気|気温/.test(cmd)) {
                if (currentWeatherJa !== "不明") {
                    speak(`現在の天気は${currentWeatherJa}、気温は${currentTemp}度です。`);
                } else {
                    speak('申し訳ありません。現在天気の情報を取得できておりません。');
                }
            } else if (/スキャン|分析|解析/.test(cmd)) {
                speak('周囲の環境をスキャンしています... 脅威は検出されませんでした。');
                document.getElementById('target-reticle').style.borderColor = '#0f0';
                setTimeout(() => document.getElementById('target-reticle').style.borderColor = 'var(--hud-border-color)', 3000);
            } 
            
            // --- 11. シャットダウン・スリープ ---
            else if (/終了|シャットダウン|スリープ|おやすみ|バイバイ/.test(cmd)) {
                speak(`システムをスリープ状態に移行します。おやすみなさいませ、${userName}様。`);
                isAwake = false;
                closeTab();
                resetToNormalMode();
                
                // 目を閉じる
                document.getElementById('eye-top').style.height = '50vh';
                document.getElementById('eye-bottom').style.height = '50vh';
                
                // カメラ停止
                stopAllCameras();
                document.getElementById('cam-status').innerText = 'OFF';
                document.getElementById('cam-status').style.color = '#fff';
                setTimeout(() => addLog("システムはスリープ状態です。「起動」または「ジャーヴィス」と話しかけてください。"), 1000);
            } else {
                speak(`申し訳ありません、${userName}様。その命令の意図を正確に理解できませんでした。`);
            }
        }
    </script>
