<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web viewer & Location</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f6f8;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            gap: 6px;
            width: 100%;
        }
        input[type="text"], select {
            flex: 1;
            padding: 12px;
            font-size: 16px; /* iOS自動ズーム防止 */
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            background-color: #fff;
        }
        select {
            min-width: 180px;
        }
        button {
            padding: 12px 14px;
            font-size: 14px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            touch-action: manipulation;
            flex: 1;
            min-width: 110px;
            text-align: center;
        }
        button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        button.voice-btn {
            background-color: #6c757d;
            flex: 0 0 auto;
            min-width: auto;
            padding: 12px 16px;
        }
        button.voice-btn.recording {
            background-color: #dc3545;
            animation: pulse 1.5s infinite;
        }
        button.tab-btn {
            background-color: #28a745;
        }
        button.loc-btn {
            background-color: #17a2b8;
        }
        button.bat-btn {
            background-color: #ff9800;
        }
        .meter-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            background: #222;
            padding: 10px 14px;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
        }
        .meter-bar {
            flex: 1;
            height: 16px;
            background: #444;
            border-radius: 8px;
            overflow: hidden;
        }
        .meter-fill {
            width: 0%;
            height: 100%;
            background-color: #ffd700; /* 黄色のボイスメーター */
            transition: width 0.05s ease;
        }
        .info-display {
            margin-bottom: 8px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 6px;
            font-size: 13px;
            color: #333;
            word-break: break-all;
        }
        .iframe-container {
            width: 100%;
            height: 55vh;
            min-height: 350px;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            line-height: 1.4;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            button {
                font-size: 13px;
                padding: 10px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="input-group">
                <input type="text" id="url-input" placeholder="URLまたはキーワードを入力 (「現在地」で位置取得)" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
                <button class="voice-btn" id="voice-btn" onclick="toggleVoiceInput()" title="音声入力">🎤</button>
            </div>
            
            <!-- ボイス選択 -->
            <select id="voice-select" title="読み上げボイス選択">
                <option value="">読み上げボイスを読み込み中...</option>
            </select>

            <button onclick="loadUrl()">表示</button>
            <button class="tab-btn" onclick="openNewTab()">別のタブで開く</button>
            <button class="loc-btn" onclick="getLocation()">現在位置を確認</button>
            <button class="bat-btn" onclick="getBatteryInfo()">バッテリー残量</button>
        </div>

        <!-- 黄色のボイスメーター -->
        <div class="meter-container">
            <span>ボイスメーター:</span>
            <div class="meter-bar">
                <div id="voice-meter-fill" class="meter-fill"></div>
            </div>
        </div>

        <div id="location-display" class="info-display">現在位置: 未取得</div>
        <div id="battery-display" class="info-display">バッテリー情報: 未取得</div>

        <div class="iframe-container">
            <iframe id="web-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <p class="note">※ YouTube動画は自動で埋め込み用URLに変換して表示します。Google検索画面などのセキュリティ制限があるサイトは「別のタブで開く」で閲覧してください。</p>
    </div>

    <script>
        let recognition = null;
        let isRecognizing = false;
        let audioCtx = null;
        let analyser = null;
        let microphone = null;
        let voicesList = [];

        // 音声合成（読み上げ）機能
        function populateVoices() {
            if ('speechSynthesis' in window) {
                voicesList = window.speechSynthesis.getVoices();
                const select = document.getElementById('voice-select');
                select.innerHTML = '';

                if (voicesList.length === 0) {
                    const opt = document.createElement('option');
                    opt.textContent = '標準ボイス';
                    select.appendChild(opt);
                    return;
                }

                voicesList.forEach((voice, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    if (voice.default || voice.lang.includes('ja')) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = populateVoices;
            populateVoices();
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                const select = document.getElementById('voice-select');
                if (select.value && voicesList[select.value]) {
                    utter.voice = voicesList[select.value];
                }
                window.speechSynthesis.speak(utter);
            }
        }

        // 音声認識の初期設定
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;
            recognition.continuous = false; // ピコン音連続防止

            recognition.onstart = function() {
                isRecognizing = true;
                const btn = document.getElementById('voice-btn');
                btn.classList.add('recording');
                btn.textContent = '⏹️';
                startVoiceMeter();
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.trim();
                document.getElementById('url-input').value = transcript;

                // ボイスで現在位置やバッテリーの指示があった場合の判定
                if (transcript.includes('現在地') || transcript.includes('位置') || transcript.includes('場所')) {
                    getLocation();
                } else if (transcript.includes('バッテリー') || transcript.includes('電池') || transcript.includes('残量')) {
                    getBatteryInfo();
                } else {
                    loadUrl();
                }
            };

            recognition.onerror = function() {
                stopVoiceInput();
            };

            recognition.onend = function() {
                stopVoiceInput();
            };
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert('お使いのブラウザ・端末は音声入力に対応していません。');
                return;
            }
            if (isRecognizing) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    stopVoiceInput();
                }
            }
        }

        function stopVoiceInput() {
            isRecognizing = false;
            const btn = document.getElementById('voice-btn');
            btn.classList.remove('recording');
            btn.textContent = '🎤';
        }

        // 黄色のボイスメーター（マイク音量取得）
        async function startVoiceMeter() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                function updateMeter() {
                    if (!isRecognizing) {
                        document.getElementById('voice-meter-fill').style.width = '0%';
                        return;
                    }
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        sum += dataArray[i];
                    }
                    let average = sum / dataArray.length;
                    let volumePercentage = Math.min(100, Math.max(0, (average / 100) * 100));
                    document.getElementById('voice-meter-fill').style.width = volumePercentage + '%';
                    requestAnimationFrame(updateMeter);
                }
                updateMeter();
            } catch(e) {
                console.log('ボイスメーターのマイク取得に失敗:', e);
            }
        }

        // 入力されたURLの整形・YouTube再生用URL変換
        function formatUrl(input) {
            let url = input.trim();
            if (!url) return '';

            const ytMatch = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
            if (ytMatch && ytMatch[1]) {
                return `https://www.youtube.com/embed/${ytMatch[1]}`;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                if (!url.includes('.')) {
                    return `https://www.google.com/search?q=${encodeURIComponent(url)}`;
                }
                url = 'https://' + url;
            }

            return url;
        }

        // 枠内（iframe）に読み込む
        function loadUrl() {
            const input = document.getElementById('url-input').value;
            const targetUrl = formatUrl(input);
            if (targetUrl) {
                document.getElementById('web-frame').src = targetUrl;
            }
        }

        // 別のタブで開く
        function openNewTab() {
            const input = document.getElementById('url-input').value;
            let targetUrl = input.trim();

            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                if (!targetUrl.includes('.')) {
                    targetUrl = `https://www.google.com/search?q=${encodeURIComponent(targetUrl)}`;
                } else {
                    targetUrl = 'https://' + targetUrl;
                }
            }

            if (targetUrl) {
                window.open(targetUrl, '_blank');
            }
        }

        // 現在位置の確認（Geolocation API & 音声アナウンス）
        function getLocation() {
            const display = document.getElementById('location-display');
            if (navigator.geolocation) {
                display.textContent = '現在位置を取得中...';
                speakText('現在位置を取得しています');
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const msg = `現在位置: 緯度 ${lat.toFixed(5)} / 経度 ${lng.toFixed(5)}`;
                        display.textContent = msg;
                        speakText('現在位置を取得しました。');
                    },
                    (error) => {
                        const errMsg = `位置情報の取得に失敗しました (${error.message})`;
                        display.textContent = errMsg;
                        speakText('位置情報の取得に失敗しました。');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                display.textContent = 'お使いのブラウザは位置情報に対応していません。';
                speakText('位置情報に対応していません。');
            }
        }

        // バッテリー残量の確認（Battery Status API & 音声アナウンス）
        function getBatteryInfo() {
            const display = document.getElementById('battery-display');
            if ('getBattery' in navigator) {
                navigator.getBattery().then((battery) => {
                    const level = Math.round(battery.level * 100);
                    const charging = battery.charging ? '充電中' : '放電中（バッテリー駆動）';
                    const msg = `バッテリー残量: ${level}% (${charging})`;
                    display.textContent = msg;
                    speakText(`現在のバッテリー残量は ${level}パーセントです。`);
                });
            } else {
                display.textContent = 'お使いの端末・ブラウザはバッテリー情報の取得に対応していません。';
                speakText('バッテリー情報の取得に対応していません。');
            }
        }

        // 初開時に初期URLをロード
        window.onload = function() {
            loadUrl();
        };
    </script>
</body>
</html>
