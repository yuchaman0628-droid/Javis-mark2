<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Interface</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #050b14;
      color: #00f3ff;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    /* HUD リアクターアニメーション */
    .hud-container {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed #00f3ff;
      border-radius: 50%;
      animation: rotate 20s linear infinite;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }
    .inner-ring {
      position: absolute;
      width: 70%;
      height: 70%;
      border: 3px solid #00f3ff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: rotate-reverse 10s linear infinite;
    }
    .core {
      width: 35%;
      height: 35%;
      background: radial-gradient(circle, #00f3ff 0%, rgba(0, 243, 255, 0.2) 70%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 25px #00f3ff;
      animation: pulse 2s ease-in-out infinite;
    }
    /* コンソール */
    .console {
      width: 90%;
      max-width: 500px;
      background: rgba(5, 15, 30, 0.85);
      border: 1px solid #00f3ff;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    }
    .status {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #00a8b3;
      margin-bottom: 0.5rem;
    }
    .display-text {
      min-height: 60px;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 1rem;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
    }
    .input-group {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid #00f3ff;
      padding: 10px 15px;
      color: #fff;
      border-radius: 4px;
      outline: none;
    }
    input[type="text"]:focus {
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }
    button {
      background: #00f3ff;
      color: #050b14;
      border: none;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #fff;
      box-shadow: 0 0 15px #00f3ff;
    }
    /* カメラ映像エリア */
    .camera-container {
      width: 90%;
      max-width: 500px;
      background: rgba(5, 15, 30, 0.85);
      border: 1px solid #00f3ff;
      border-radius: 8px;
      margin-top: 1rem;
      display: none;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    }
    .camera-stream {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rotate-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
  </style>
</head>
<body>

  <div class="hud-container">
    <div class="outer-ring"></div>
    <div class="inner-ring"></div>
    <div class="core"></div>
  </div>

  <div class="console">
    <div class="status" id="status">SYSTEM ONLINE // READY</div>
    <div class="display-text" id="display">「システム起動完了。サー、どのようなご用件でしょうか？」</div>
    <div class="input-group">
      <input type="text" id="userInput" placeholder="コマンドを入力、またはマイクを押してください...">
      <button onclick="startVoiceRecognition()" title="音声入力">🎤</button>
      <button onclick="processInput()">送信</button>
    </div>
  </div>

  <!-- カメラ映像エリア -->
  <div class="camera-container" id="camera-container">
    <video class="camera-stream" id="camera-stream" autoplay playsinline></video>
  </div>

  <script>
    // グローバル変数
    let currentStream = null;
    let currentFacingMode = 'user';

    // AI風音声読み上げ機能（トーン・ピッチ・ボイス選択を調整）
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';

        // 利用可能な音声からAI/システム風の音声を選択
        const voices = window.speechSynthesis.getVoices();
        const aiVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Keita') || v.name.includes('Ichiro')));
        if (aiVoice) utterance.voice = aiVoice;

        utterance.pitch = 0.85; // 少し低めのクールなトーン
        utterance.rate = 1.05;  // スムーズなスピード
        window.speechSynthesis.speak(utterance);
      }
    }

    // ブラウザの音声一覧ロード対策
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    // 日付情報取得（追加）
    function getDateInfo() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      const dayName = days[now.getDay()];
      return `本日の日付は ${year}年${month}月${date}日 ${dayName}曜日です。`;
    }

    // バッテリー残量取得（追加）
    async function getBatteryInfo() {
      if ('getBattery' in navigator) {
        try {
          const battery = await navigator.getBattery();
          const level = Math.round(battery.level * 100);
          const charging = battery.charging ? "充電中" : "バッテリー駆動中";
          return `現在のバッテリー残量は ${level}% です。ステータスは${charging}です。`;
        } catch (e) {
          return "申し訳ありません、バッテリー情報の取得に失敗しました。";
        }
      } else {
        return "お使いのデバイス/ブラウザはバッテリー情報の取得に対応していません。";
      }
    }

    // 実際の気象データ取得 (Open-Meteo APIを使用)
    async function fetchWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&current_weather=true&timezone=Asia%2FTokyo");
        const data = await res.json();
        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;
        
        let weatherDesc = "晴れ";
        if (code === 0) weatherDesc = "快晴";
        else if ([1, 2, 3].includes(code)) weatherDesc = "晴れ時々曇り";
        else if ([45, 48].includes(code)) weatherDesc = "霧";
        else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) weatherDesc = "雨";
        else if ([71, 73, 75, 77, 85, 86].includes(code)) weatherDesc = "雪";
        else if ([95, 96, 99].includes(code)) weatherDesc = "雷雨";

        return `現在の東京の天気は${weatherDesc}、気温は${temp}度です。`;
      } catch (e) {
        return "申し訳ありません、気象データの取得に失敗しました。";
      }
    }

    // カメラ起動・制御機能
    async function startCamera(facingMode) {
      const videoEl = document.getElementById('camera-stream');
      const cameraContainerEl = document.getElementById('camera-container');

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode }
        });
        videoEl.srcObject = stream;
        cameraContainerEl.style.display = "block";
        currentStream = stream;
        currentFacingMode = facingMode;
        return true;
      } catch (e) {
        cameraContainerEl.style.display = "none";
        return false;
      }
    }

    async function switchCamera(facingMode) {
      if (!currentStream) {
        return await startCamera(facingMode);
      }
      if (currentFacingMode === facingMode) return;
      return await startCamera(facingMode);
    }

    // 音声認識（操作）機能
    function startVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("お使いのブラウザは音声認識に対応していません。Google Chrome等をご利用ください。");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;

      const statusEl = document.getElementById('status');
      statusEl.innerText = "LISTENING...";

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
        processInput();
      };

      recognition.onerror = () => {
        statusEl.innerText = "SYSTEM ONLINE // READY";
      };

      recognition.start();
    }

    // 入力処理と応答ロジック
    async function processInput() {
      const inputEl = document.getElementById('userInput');
      const displayEl = document.getElementById('display');
      const statusEl = document.getElementById('status');
      const query = inputEl.value.trim();

      if (!query) return;

      statusEl.innerText = "PROCESSING...";
      displayEl.innerText = `解析中: "${query}"`;
      inputEl.value = "";

      let response = "申し訳ありません。そのコマンドは現在のプロトコルに登録されていません。";

      if (query.includes("こんにちは") || query.includes("起動")) {
        response = "こんにちは、サー。すべてのシステムは正常に稼働しています。";
      } else if (query.includes("誰") || query.includes("名前")) {
        response = "私はJ.A.R.V.I.S.、あなたのAIアシスタントです。";
      } else if (query.includes("時間") || query.includes("時刻")) {
        const now = new Date();
        response = `現在の時刻は ${now.getHours()}時${now.getMinutes()}分です。`;
      } else if (query.includes("日付") || query.includes("今日") || query.includes("カレンダー")) {
        // 日付コマンド（追加）
        response = getDateInfo();
      } else if (query.includes("バッテリー") || query.includes("電池") || query.includes("残量")) {
        // バッテリー残量コマンド（追加）
        response = await getBatteryInfo();
      } else if (query.includes("読み上げて") || query.includes("喋って") || query.includes("言って")) {
        // 任意の文字を読み上げるコマンド（追加）
        let readText = query.replace(/読み上げて|喋って|言って/g, "").replace(/と|を/g, "").trim();
        response = readText ? readText : "何を読み上げればよろしいでしょうか？";
      } else if (query.includes("天気")) {
        const weatherInfo = await fetchWeather();
        response = `${weatherInfo} スーツの飛行テストの参考にしてください。`;
      } else if (query.includes("カメラ") && (query.includes("起動") || query.includes("つけて"))) {
        statusEl.innerText = "ACCESSING CAMERA...";
        const success = await startCamera('user');
        response = success ? "了解、カメラを起動します。" : "申し訳ありません、カメラへのアクセスが拒否されました。";
      } else if (query.includes("インカメラ") || query.includes("内側カメラ")) {
        statusEl.innerText = "SWITCHING CAMERA...";
        const success = await switchCamera('user');
        response = success ? "了解、インカメラに切り替えます。" : "インカメラへの切り替えに失敗しました。";
      } else if (query.includes("アウトカメラ") || query.includes("外側カメラ")) {
        statusEl.innerText = "SWITCHING CAMERA...";
        const success = await switchCamera('environment');
        response = success ? "了解、アウトカメラに切り替えます。" : "アウトカメラへの切り替えに失敗しました。";
      } else if (query.includes("検索")) {
        let searchQuery = query.replace("検索", "").replace("して", "").replace("を", "").trim();
        if (searchQuery) {
          response = `了解、"${searchQuery}"で外部データベースを検索します。`;
          setTimeout(() => {
            window.open(`https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`, '_blank');
          }, 1000);
        } else {
          response = "検索クエリがありません。何について調べればいいでしょうか？";
        }
      }

      setTimeout(() => {
        displayEl.innerText = response;
        statusEl.innerText = (query.includes("カメラ") && startCamera) ? "CAMERA ACTIVE" : "SYSTEM ONLINE // READY";
        speak(response);
      }, 400);
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') processInput();
    });
  </script>
</body>
</html>
