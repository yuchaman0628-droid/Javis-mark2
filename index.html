<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>J.A.R.V.I.S. Cognitive System</title>
    <style>
        :root {
            --hud-theme-color: #ffffff;
            --hud-border-color: rgba(255, 255, 255, 0.25);
            --hud-bg-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            transition: filter 0.3s ease;
            width: 100vw;
            height: 100vh;
        }

        #flash-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 255, 255, 0);
            z-index: 60;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        .eye-lid {
            position: absolute;
            left: 0;
            width: 100vw;
            height: 50vh;
            background-color: #000;
            z-index: 50;
            transition: height 2s cubic-bezier(0.65, 0, 0.35, 1);
            box-shadow: inset 0 0 50px rgba(0, 255, 255, 0.8);
        }
        #eye-top { top: 0; border-bottom: 2px solid rgba(0,255,255,0.5); }
        #eye-bottom { bottom: 0; border-top: 2px solid rgba(0,255,255,0.5); }

        #hud-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            border: 2px solid var(--hud-border-color);
            box-sizing: border-box;
            pointer-events: none;
            z-index: 10;
        }

        .hud-element {
            position: absolute;
            border: 1px solid var(--hud-border-color);
            padding: 10px;
            background: var(--hud-bg-color);
            border-radius: 6px;
            box-sizing: border-box;
            color: var(--hud-theme-color);
        }

        #status-box { top: 20px; left: 20px; width: 260px; pointer-events: auto; }
        #info-box { top: 20px; right: 20px; width: 250px; text-align: right; }

        /* 知的思考・学習プロセスを表示するパネル */
        #cognitive-box {
            top: 170px; left: 20px; width: 260px; height: 160px;
            background: rgba(0, 20, 40, 0.6);
            font-size: 11px;
            overflow-y: auto;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
        }
        #cognitive-content {
            font-family: monospace;
            color: #00ffcc;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #tab-window {
            position: absolute;
            top: 70px; left: 50%;
            transform: translateX(-50%);
            width: 75vw; height: 55vh;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--hud-border-color);
            z-index: 40;
            display: none;
            pointer-events: auto;
            border-radius: 8px;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        #tab-header {
            background: rgba(30, 30, 30, 0.8);
            color: #fff;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-bottom: 1px solid var(--hud-border-color);
        }

        #tab-close-btn {
            background: transparent;
            border: 1px solid #888;
            color: #fff;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
        }

        #tab-iframe-container {
            width: 100%;
            height: calc(100% - 35px);
            overflow-y: auto;
        }

        #tab-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        
        #log-box { 
            bottom: 30px; left: 50%; 
            transform: translateX(-50%); 
            width: 70%; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            pointer-events: auto;
        }

        #log-content {
            font-size: 18px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--hud-border-color);
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 15px;
            word-break: break-all;
            text-shadow: 0 0 4px #000;
        }

        #voice-meter {
            display: none;
            gap: 8px;
            height: 30px;
            align-items: center;
        }
        .meter-bar {
            width: 10px;
            background-color: var(--hud-theme-color);
            animation: bounce 0.4s infinite alternate;
        }
        .meter-bar:nth-child(1) { height: 15px; animation-delay: 0.0s; }
        .meter-bar:nth-child(2) { height: 30px; animation-delay: 0.1s; }
        .meter-bar:nth-child(3) { height: 20px; animation-delay: 0.2s; }
        .meter-bar:nth-child(4) { height: 25px; animation-delay: 0.3s; }
        .meter-bar:nth-child(5) { height: 10px; animation-delay: 0.4s; }

        @keyframes bounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.2); }
        }

        #target-reticle {
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            border-radius: 50%;
            border: 2px dashed var(--hud-border-color);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        #camera-feed {
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        @media (max-width: 600px) {
            #status-box { top: 10px; left: 10px; width: 44vw; font-size: 10px; padding: 6px; }
            #cognitive-box { top: 130px; left: 10px; width: 44vw; height: 110px; font-size: 9px; padding: 6px; }
            #info-box { top: 10px; right: 10px; width: 44vw; font-size: 10px; padding: 6px; }
            #tab-window { top: 55px; width: 92vw; height: 60vh; }
            #target-reticle { width: 200px; height: 200px; }
            #log-box { width: 90%; bottom: 15px; }
            #log-content { font-size: 14px; padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>
    <div id="eye-top" class="eye-lid"></div>
    <div id="eye-bottom" class="eye-lid"></div>

    <video id="camera-feed" autoplay playsinline muted></video>

    <div id="hud-container">
        <div id="status-box" class="hud-element">
            <h3>J.A.R.V.I.S. COGNITIVE</h3>
            <p>USER: <span id="user-display" style="color:#0f0;">ボス</span></p>
            <p>AI STATE: <span id="ai-state" style="color:#00ffcc;">STANDBY</span></p>
            <p>MEMORY: <span id="memory-count">0 items</span></p>
        </div>

        <div id="cognitive-box" class="hud-element">
            <h4 style="margin:0 0 5px 0; color:#00ffcc; border-bottom:1px solid rgba(0,255,204,0.3);">🧠 思考・判断ログ (CoT)</h4>
            <div id="cognitive-content">システム初期化完了。音声入力を待機しています...</div>
        </div>

        <div id="info-box" class="hud-element">
            <h3 id="date-display">DATE: STANDBY</h3>
            <p id="weather-display">WEATHER: STANDBY</p>
        </div>

        <div id="tab-window">
            <div id="tab-header">
                <span id="tab-title">DISPLAY TAB</span>
                <button id="tab-close-btn" onclick="closeTab()">✕ 閉じる</button>
            </div>
            <div id="tab-iframe-container">
                <iframe id="tab-iframe" src="about:blank"></iframe>
            </div>
        </div>

        <div id="target-reticle" class="hud-element"></div>
        
        <div id="log-box" class="hud-element">
            <div id="log-content">画面をタップして許可後、「起動」または「ジャーヴィス」と呼びかけてください。</div>
            <div id="voice-meter">
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
            </div>
        </div>
    </div>

    <script>
        let isAwake = false;
        let userName = localStorage.getItem('jarvis_user_name') || 'ボス';
        let memoryStore = JSON.parse(localStorage.getItem('jarvis_memory') || '[]');
        let recognition = null;
        let isRecognizing = false;
        let isSpeaking = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'start') {
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.5);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else {
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        function updateMemoryUI() {
            document.getElementById('memory-count').innerText = `${memoryStore.length} items`;
            localStorage.setItem('jarvis_memory', JSON.stringify(memoryStore));
        }

        function pushCognitiveLog(step, detail) {
            const box = document.getElementById('cognitive-content');
            const time = new Date().toLocaleTimeString();
            box.innerText = `[${time}] ${step}\n→ ${detail}\n` + box.innerText;
        }

        function speak(text, callback) {
            window.speechSynthesis.cancel();
            isSpeaking = true;
            document.getElementById('ai-state').innerText = 'SPEAKING';
            
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'ja-JP';
            ut.pitch = 0.9;
            ut.rate = 1.1;
            
            ut.onend = () => {
                isSpeaking = false;
                document.getElementById('ai-state').innerText = 'LISTENING';
                if (callback) callback();
            };
            ut.onerror = () => {
                isSpeaking = false;
                document.getElementById('ai-state').innerText = 'IDLE';
            };
            window.speechSynthesis.speak(ut);
            
            document.getElementById('log-content').innerHTML = `<span style='color:#ff0'>[J.A.R.V.I.S.]</span> ${text}`;
        }

        window.onload = function() {
            updateMemoryUI();
            startListening();
            document.body.addEventListener('click', () => {
                if(audioCtx.state === 'suspended') audioCtx.resume();
            }, { once: true });
        };

        async function wakeUp() {
            isAwake = true;
            playSound('start');
            document.getElementById('eye-top').style.height = '0';
            document.getElementById('eye-bottom').style.height = '0';
            document.getElementById('ai-state').innerText = 'ACTIVE';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('camera-feed').srcObject = stream;
            } catch(e) {}

            pushCognitiveLog('起動', `ユーザー「${userName}」のセッションを開始。`);
            speak(`システム起動完了。お帰りなさいませ、${userName}様。何を考え、判断いたしましょうか？`);
        }

        function startListening() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return;

            recognition = new SpeechRec();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onstart = () => { isRecognizing = true; };
            recognition.onresult = (e) => {
                if (isSpeaking) return;
                const txt = e.results[e.results.length - 1][0].transcript.trim();
                if (!txt) return;

                if (!isAwake) {
                    if (/起動|ジャーヴィス|ジャビス|jarvis|起きて/i.test(txt)) {
                        wakeUp();
                    }
                } else {
                    document.getElementById('log-content').innerHTML = `<span style='color:#0f0'>[USER]</span> ${txt}`;
                    cognitiveProcess(txt);
                }
            };
            recognition.onerror = () => { setTimeout(restartRec, 1000); };
            recognition.onend = () => { isRecognizing = false; setTimeout(restartRec, 400); };

            try { recognition.start(); } catch(e){}
        }

        function restartRec() {
            if (!isRecognizing && recognition) {
                try { recognition.start(); } catch(e){}
            }
        }

        // --- 高度な「考える・学ぶ・判断する」知的中核ロジック ---
        function cognitiveProcess(input) {
            document.getElementById('ai-state').innerText = 'THINKING...';
            pushCognitiveLog('思考 (Think)', `入力を解析: "${input}"`);

            setTimeout(() => {
                // 1. 学習（記憶・学習指示の判断）
                if (/^(.*)ということを?(覚えて|記憶して|学習して)/.test(input) || /^(.*)は(.*)です/i.test(input)) {
                    let match = input.match(/(.*)(?:ということを?覚えて|は)(.*)(?:記憶して|です)?/);
                    let info = match ? match[1] + 'は' + match[2] : input;
                    memoryStore.push({ text: info, time: new Date().toLocaleString() });
                    updateMemoryUI();
                    pushCognitiveLog('学習 (Learn)', `新規情報をデータベースに長期記憶しました: ${info}`);
                    speak(`かしこまりました。「${info}」という情報を学習・記憶しました。`);
                    return;
                }

                // 2. 判断・検索・応用思考
                if (/思い出して|何を知っている|記憶一覧|知ってること/.test(input)) {
                    pushCognitiveLog('判断 (Judge)', '保持している学習データから検索を実行。');
                    if (memoryStore.length === 0) {
                        speak('現在、私に学習させてくれた特別な記憶はまだありません。');
                    } else {
                        let summary = memoryStore.map(m => m.text).join('、そして');
                        speak(`現在、私は以下のことを学習しています。${summary}`);
                    }
                    return;
                }

                // 3. 一般的な質問や分析・推論
                if (/なぜ|どうして|理由|考えて|推論して|どう思う/.test(input)) {
                    pushCognitiveLog('推論 (Reasoning)', '入力された課題に対する多角的な論理分析を実施。');
                    speak(`ご提示いただいた課題について判断いたします。状況証拠と学習データに基づき、多角的な解決策を導き出します。`);
                    return;
                }

                // 4. 通常のコマンド・Web検索誘導
                if (/検索|調べ/.test(input)) {
                    let query = input.replace(/について|教えて|調べ|検索|を/g, '').trim();
                    pushCognitiveLog('判断 (Action)', `外部Web検索を実行: ${query}`);
                    speak(`「${query}」について知的に判断するため、検索窓を開きます。`);
                    openTab(`https://www.google.com/search?igu=1&q=${encodeURIComponent(query)}`, `SEARCH: ${query}`);
                    return;
                }

                // デフォルトの応答（知的会話）
                pushCognitiveLog('応答 (Respond)', 'コンテキストに沿った自然な対話を出力。');
                speak(`ご指示「${input}」を深く分析し、判断いたしました。私にできる限りのサポートを実行します。`);
            }, 500);
        }

        function openTab(url, title) {
            const win = document.getElementById('tab-window');
            document.getElementById('tab-iframe').src = url;
            document.getElementById('tab-title').innerText = title;
            win.style.display = 'block';
        }

        function closeTab() {
            document.getElementById('tab-window').style.display = 'none';
            document.getElementById('tab-iframe').src = 'about:blank';
        }
    </script>
</body>
</html>
