<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web viewer & Location</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f6f8;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            gap: 6px;
            width: 100%;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 16px; /* iOSの自動ズーム防止 */
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        button {
            padding: 12px 14px;
            font-size: 14px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            touch-action: manipulation;
            flex: 1;
            min-width: 110px;
            text-align: center;
        }
        button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        button.voice-btn {
            background-color: #6c757d;
            flex: 0 0 auto;
            min-width: auto;
            padding: 12px 16px;
        }
        button.voice-btn.recording {
            background-color: #dc3545;
            animation: pulse 1.5s infinite;
        }
        button.tab-btn {
            background-color: #28a745;
        }
        button.loc-btn {
            background-color: #17a2b8;
        }
        #location-display {
            margin-bottom: 12px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 6px;
            font-size: 13px;
            color: #333;
            word-break: break-all;
        }
        .iframe-container {
            width: 100%;
            height: 55vh;
            min-height: 350px;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            line-height: 1.4;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            button {
                font-size: 13px;
                padding: 10px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="input-group">
                <input type="text" id="url-input" placeholder="URLまたはキーワードを入力" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
                <button class="voice-btn" id="voice-btn" onclick="toggleVoiceInput()" title="音声入力">🎤</button>
            </div>
            <button onclick="loadUrl()">表示</button>
            <button class="tab-btn" onclick="openNewTab()">別のタブで開く</button>
            <button class="loc-btn" onclick="getLocation()">現在位置を確認</button>
        </div>

        <div id="location-display">現在位置: 未取得</div>

        <div class="iframe-container">
            <iframe id="web-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <p class="note">※ YouTube動画は自動で埋め込み用URLに変換して表示します。Google検索画面などのセキュリティ制限があるサイトは「別のタブで開く」で閲覧してください。</p>
    </div>

    <script>
        let recognition = null;
        let isRecognizing = false;

        // 音声認識の初期設定（スマホでのピコン音連続発生を防止）
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;
            recognition.continuous = false; // 連続認識をOFFにして連続通知音を回避

            recognition.onstart = function() {
                isRecognizing = true;
                const btn = document.getElementById('voice-btn');
                btn.classList.add('recording');
                btn.textContent = '⏹️';
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('url-input').value = transcript;
                loadUrl();
            };

            recognition.onerror = function(event) {
                stopVoiceInput();
            };

            recognition.onend = function() {
                // 自動ループを行わず終了させることで音の連続鳴動を防止
                stopVoiceInput();
            };
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert('お使いのブラウザ・端末は音声入力に対応していません。');
                return;
            }
            if (isRecognizing) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    stopVoiceInput();
                }
            }
        }

        function stopVoiceInput() {
            isRecognizing = false;
            const btn = document.getElementById('voice-btn');
            btn.classList.remove('recording');
            btn.textContent = '🎤';
        }

        // 入力されたURLの整形・YouTube再生用URL変換
        function formatUrl(input) {
            let url = input.trim();
            if (!url) return '';

            // YouTube URLの検出および embed 形式への自動変換
            const ytMatch = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
            if (ytMatch && ytMatch[1]) {
                return `https://www.youtube.com/embed/${ytMatch[1]}`;
            }

            // http/https の補完および検索対応
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                if (!url.includes('.')) {
                    return `https://www.google.com/search?q=${encodeURIComponent(url)}`;
                }
                url = 'https://' + url;
            }

            return url;
        }

        // 枠内（iframe）に読み込む
        function loadUrl() {
            const input = document.getElementById('url-input').value;
            const targetUrl = formatUrl(input);
            if (targetUrl) {
                document.getElementById('web-frame').src = targetUrl;
            }
        }

        // 別のタブで開く
        function openNewTab() {
            const input = document.getElementById('url-input').value;
            let targetUrl = input.trim();

            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                if (!targetUrl.includes('.')) {
                    targetUrl = `https://www.google.com/search?q=${encodeURIComponent(targetUrl)}`;
                } else {
                    targetUrl = 'https://' + targetUrl;
                }
            }

            if (targetUrl) {
                window.open(targetUrl, '_blank');
            }
        }

        // 現在位置の確認（Geolocation API）
        function getLocation() {
            const display = document.getElementById('location-display');
            if (navigator.geolocation) {
                display.textContent = '現在位置を取得中...';
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        display.textContent = `現在位置: 緯度 ${lat.toFixed(5)} / 経度 ${lng.toFixed(5)}`;
                    },
                    (error) => {
                        display.textContent = `位置情報の取得に失敗しました (${error.message})`;
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                display.textContent = 'お使いのブラウザは位置情報に対応していません。';
            }
        }

        // 初開時に初期URLをロード
        window.onload = function() {
            loadUrl();
        };
    </script>
</body>
</html>
