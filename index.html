<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* HUD（ヘッドアップディスプレイ）風の装飾 */
        #hud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: 5px solid rgba(0, 255, 255, 0.3);
            box-sizing: border-box;
            pointer-events: none;
            z-index: 10;
        }

        .hud-element {
            position: absolute;
            border: 1px solid #0ff;
            padding: 10px;
            background: rgba(0, 20, 40, 0.5);
            box-shadow: 0 0 10px #0ff;
        }

        #status-box { top: 20px; left: 20px; width: 250px; }
        #log-box { bottom: 20px; left: 20px; width: 400px; height: 150px; overflow-y: auto; }
        #target-reticle {
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            border-radius: 50%;
            border: 2px dashed #0ff;
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* カメラ映像 */
        #camera-feed {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            filter: contrast(1.2) brightness(0.8) hue-rotate(180deg) opacity(0.7);
            z-index: 1;
        }

        /* 起動ボタン（ブラウザの仕様上、ユーザーのアクションが必要） */
        #start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 24px;
            background: #000;
            color: #0ff;
            border: 2px solid #0ff;
            cursor: pointer;
            z-index: 20;
            pointer-events: auto;
            box-shadow: 0 0 15px #0ff;
            transition: 0.3s;
        }

        #start-btn:hover {
            background: #0ff;
            color: #000;
        }
    </style>
</head>
<body>

    <button id="start-btn" onclick="startJarvis()">システム起動 (Boot J.A.R.V.I.S.)</button>

    <video id="camera-feed" autoplay playsinline></video>

    <div id="hud-container">
        <div id="status-box" class="hud-element">
            <h3>J.A.R.V.I.S. ONLINE</h3>
            <p>CAMERA: <span id="cam-status">OFF</span></p>
            <p>MIC: <span id="mic-status">OFF</span></p>
        </div>
        <div id="target-reticle" class="hud-element"></div>
        <div id="log-box" class="hud-element">
            <strong>SYSTEM LOG:</strong><br>
            <span id="log-content"></span>
        </div>
    </div>

    <script>
        // ログ出力関数
        function addLog(text, isJarvis = false) {
            const logContent = document.getElementById('log-content');
            const prefix = isJarvis ? "<span style='color:#ff0'>[J.A.R.V.I.S.]</span> " : "[USER] ";
            logContent.innerHTML += prefix + text + "<br>";
            document.getElementById('log-box').scrollTop = document.getElementById('log-box').scrollHeight;
        }

        // 音声合成（J.A.R.V.I.S.が喋る）
        function speak(text) {
            addLog(text, true);
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.pitch = 0.8; // 少し低めの声
            utterance.rate = 1.1;  // 少し早口
            synth.speak(utterance);
        }

        // コマンド処理
        function processCommand(command) {
            if (command.includes('こんにちは') || command.includes('おはよう')) {
                speak('こんにちは、ボス。本日のシステムはすべて正常に稼働しています。');
            } else if (command.includes('時間') || command.includes('何時')) {
                const now = new Date();
                speak(`現在の時刻は${now.getHours()}時${now.getMinutes()}分です。`);
            } else if (command.includes('天気')) {
                speak('申し訳ありません、外部ネットワークへの接続がまだ実装されていません。外を見て確認してください。');
            } else if (command.includes('スキャン')) {
                speak('周囲の環境をスキャンしています... 脅威は検出されませんでした。');
                document.getElementById('target-reticle').style.borderColor = '#0f0';
                setTimeout(() => document.getElementById('target-reticle').style.borderColor = '#0ff', 3000);
            } else if (command.includes('終了') || command.includes('シャットダウン')) {
                speak('システムをスリープ状態に移行します。おやすみなさいませ、ボス。');
            } else {
                speak('すみません、そのコマンドは認識できませんでした。');
            }
        }

        // システム起動（カメラとマイクの許可を取得）
        async function startJarvis() {
            document.getElementById('start-btn').style.display = 'none';
            speak('システムを起動中。カメラとマイクのアクセスを許可してください。');

            // カメラの起動
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('camera-feed');
                video.srcObject = stream;
                document.getElementById('cam-status').innerText = 'ONLINE';
                document.getElementById('cam-status').style.color = '#0f0';
            } catch (err) {
                addLog('エラー: カメラにアクセスできません。', true);
            }

            // 音声認識の起動 (Web Speech API)
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.continuous = true; // 常に聞き取りを続ける
                recognition.interimResults = false;

                recognition.onstart = function() {
                    document.getElementById('mic-status').innerText = 'LISTENING...';
                    document.getElementById('mic-status').style.color = '#0f0';
                };

                recognition.onresult = function(event) {
                    const lastIndex = event.results.length - 1;
                    const transcript = event.results[lastIndex][0].transcript.trim();
                    addLog(transcript);
                    processCommand(transcript);
                };

                recognition.onerror = function(event) {
                    addLog('エラー: 音声認識が中断されました (' + event.error + ')', true);
                };

                recognition.onend = function() {
                    // 途切れても自動で再起動する
                    recognition.start();
                };

                recognition.start();
                speak('準備完了です、ボス。ご指示をどうぞ。');
            } else {
                speak('お使いのブラウザは音声認識をサポートしていません。');
            }
        }
    </script>
</body>
</html>
