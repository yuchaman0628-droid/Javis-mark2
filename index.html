<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* 目を開くアニメーション用（まぶた） */
        .eye-lid {
            position: absolute;
            left: 0;
            width: 100vw;
            height: 50vh; /* 初期状態は目を閉じている */
            background-color: #000;
            z-index: 50;
            transition: height 2s cubic-bezier(0.65, 0, 0.35, 1);
        }
        #eye-top { top: 0; }
        #eye-bottom { bottom: 0; }

        /* HUD（ヘッドアップディスプレイ）風の装飾 */
        #hud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: 5px solid rgba(0, 255, 255, 0.3);
            box-sizing: border-box;
            pointer-events: none;
            z-index: 10;
        }

        .hud-element {
            position: absolute;
            border: 1px solid #0ff;
            padding: 10px;
            background: rgba(0, 20, 40, 0.5);
            box-shadow: 0 0 10px #0ff;
        }

        #status-box { top: 20px; left: 20px; width: 250px; }
        #info-box { top: 20px; right: 20px; width: 250px; text-align: right; } /* 日付・天気用 */

        /* 画面上タブウィンドウ（操作可能） */
        #tab-window {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 75vw;
            height: 55vh;
            background: rgba(0, 15, 30, 0.95);
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
            z-index: 40;
            display: none;
            pointer-events: auto; /* クリックやスクロールなどのマウス操作を有効化 */
            border-radius: 8px;
            overflow: hidden;
        }

        #tab-header {
            background: rgba(0, 255, 255, 0.2);
            color: #0ff;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-bottom: 1px solid #0ff;
        }

        #tab-close-btn {
            background: transparent;
            border: 1px solid #0ff;
            color: #0ff;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
        }
        #tab-close-btn:hover {
            background: #0ff;
            color: #000;
        }

        #tab-iframe {
            width: 100%;
            height: calc(100% - 35px);
            border: none;
            background: #fff;
        }
        
        /* 字幕の配置（画面中央下） */
        #log-box { 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 70%; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            box-shadow: none;
        }

        #log-content {
            font-size: 20px;
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid #0ff;
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px #0ff;
        }

        /* ボイスメーター */
        #voice-meter {
            display: none; /* 初期は非表示 */
            gap: 8px;
            height: 30px;
            align-items: center;
        }
        .meter-bar {
            width: 10px;
            background-color: #0ff;
            animation: bounce 0.4s infinite alternate;
        }
        .meter-bar:nth-child(1) { height: 15px; animation-delay: 0.0s; }
        .meter-bar:nth-child(2) { height: 30px; animation-delay: 0.1s; }
        .meter-bar:nth-child(3) { height: 20px; animation-delay: 0.2s; }
        .meter-bar:nth-child(4) { height: 25px; animation-delay: 0.3s; }
        .meter-bar:nth-child(5) { height: 10px; animation-delay: 0.4s; }

        @keyframes bounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.2); }
        }

        #target-reticle {
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            border-radius: 50%;
            border: 2px dashed #0ff;
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* カメラ映像（メイン） */
        #camera-feed {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            filter: contrast(1.2) brightness(0.8) hue-rotate(180deg) opacity(0.7);
            z-index: 1;
        }

        /* 右下のインカメラ小窓（アウトカメラ起動時に使用） */
        #sub-camera-feed {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 135px;
            border: 2px solid #0ff;
            box-shadow: 0 0 15px #0ff;
            border-radius: 8px;
            object-fit: cover;
            filter: contrast(1.2) brightness(0.8) hue-rotate(180deg) opacity(0.8);
            z-index: 35;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- まぶた（起動アニメーション用） -->
    <div id="eye-top" class="eye-lid"></div>
    <div id="eye-bottom" class="eye-lid"></div>

    <!-- カメラ映像 -->
    <video id="camera-feed" autoplay playsinline muted></video>
    <!-- 右下インカメラ小窓用映像 -->
    <video id="sub-camera-feed" autoplay playsinline muted></video>

    <!-- HUDレイヤー -->
    <div id="hud-container">
        <div id="status-box" class="hud-element">
            <h3>J.A.R.V.I.S. ONLINE</h3>
            <p>CAMERA: <span id="cam-status">OFF</span></p>
            <p>MIC: <span id="mic-status">OFF</span></p>
        </div>

        <!-- 日付・天気表示ボックス -->
        <div id="info-box" class="hud-element">
            <h3 id="date-display">DATE: STANDBY</h3>
            <p id="weather-display">WEATHER: STANDBY</p>
        </div>

        <!-- 画面上表示タブウィンドウ -->
        <div id="tab-window">
            <div id="tab-header">
                <span id="tab-title">J.A.R.V.I.S. DISPLAY TAB</span>
                <button id="tab-close-btn" onclick="closeTab()">✕ 閉じる</button>
            </div>
            <iframe id="tab-iframe" src="about:blank"></iframe>
        </div>

        <div id="target-reticle" class="hud-element"></div>
        
        <!-- 字幕・ボイスメーター -->
        <div id="log-box" class="hud-element">
            <div id="log-content">マイクの許可後、「起動」または「ジャーヴィス」と呼びかけてください。</div>
            <div id="voice-meter">
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
                <div class="meter-bar"></div>
            </div>
        </div>
    </div>

    <script>
        let isAwake = false;
        let currentWeatherJa = "不明"; // 天気読み上げ用
        let currentTemp = "不明"; // 気温読み上げ用
        let currentFacingMode = 'user'; // 'user' (インカメラ) または 'environment' (アウトカメラ)
        let mainStream = null;
        let subStream = null;

        // ページ読み込みと同時に音声認識を開始
        window.onload = function() {
            startListening();
        };

        // 字幕出力関数（上書きして字幕風に表示）
        function addLog(text, isJarvis = false) {
            const logContent = document.getElementById('log-content');
            const prefix = isJarvis ? "<span style='color:#ff0'>[J.A.R.V.I.S.]</span> " : "<span style='color:#0f0'>[USER]</span> ";
            logContent.innerHTML = prefix + text;
        }

        // 音声合成（J.A.R.V.I.S.が喋る ＆ ボイスメーター起動）
        function speak(text) {
            addLog(text, true);
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.pitch = 0.8;
            utterance.rate = 1.1;

            // 喋り始めにボイスメーターを表示
            utterance.onstart = function() {
                document.getElementById('voice-meter').style.display = 'flex';
            };
            // 喋り終わりにボイスメーターを隠す
            utterance.onend = function() {
                document.getElementById('voice-meter').style.display = 'none';
            };

            synth.speak(utterance);
        }

        // 画面上タブの表示と読み込み
        function openTab(url, title = "DISPLAY TAB") {
            const tabWindow = document.getElementById('tab-window');
            const tabIframe = document.getElementById('tab-iframe');
            const tabTitle = document.getElementById('tab-title');
            
            if (url) {
                tabIframe.src = url;
            }
            tabTitle.innerText = title;
            tabWindow.style.display = 'block';
        }

        // 画面上タブを閉じる
        function closeTab() {
            document.getElementById('tab-window').style.display = 'none';
        }

        // 全カメラストリームを停止
        function stopAllCameras() {
            if (mainStream) {
                mainStream.getTracks().forEach(track => track.stop());
                mainStream = null;
            }
            if (subStream) {
                subStream.getTracks().forEach(track => track.stop());
                subStream = null;
            }
            document.getElementById('sub-camera-feed').style.display = 'none';
        }

        // カメラ設定・切り替え関数
        async function setupCamera(facingMode = 'user') {
            stopAllCameras();
            currentFacingMode = facingMode;

            const video = document.getElementById('camera-feed');
            const subVideo = document.getElementById('sub-camera-feed');

            try {
                if (facingMode === 'environment') {
                    // アウトカメラをメイン画面に設定
                    try {
                        mainStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                    } catch (e) {
                        mainStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    }
                    video.srcObject = mainStream;

                    // 右下にインカメラ（自分）を小さく表示
                    try {
                        subStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                        subVideo.srcObject = subStream;
                        subVideo.style.display = 'block';
                    } catch (e) {
                        console.log("サブカメラ(インカメラ)の起動に失敗しました", e);
                    }
                } else {
                    // インカメラをメイン画面に設定
                    mainStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    video.srcObject = mainStream;
                    subVideo.style.display = 'none';
                }

                document.getElementById('cam-status').innerText = facingMode === 'environment' ? 'ONLINE (OUT)' : 'ONLINE (IN)';
                document.getElementById('cam-status').style.color = '#0f0';
            } catch (err) {
                addLog('エラー: カメラにアクセスできません。', true);
                document.getElementById('cam-status').innerText = 'ERROR';
                document.getElementById('cam-status').style.color = '#f00';
            }
        }

        // 起動シーケンス（目を開く ＆ カメラ起動 ＆ 天気取得）
        async function wakeUp() {
            isAwake = true;
            
            // 目を開くアニメーション
            document.getElementById('eye-top').style.height = '0';
            document.getElementById('eye-bottom').style.height = '0';
            
            speak('システムを起動しました。カメラとネットワークに接続します。');

            // カメラの起動（初期値: インカメラ）
            await setupCamera('user');

            // 日付と天気の取得
            updateDateAndWeather();
        }

        // 日付と天気を取得する関数
        function updateDateAndWeather() {
            const now = new Date();
            document.getElementById('date-display').innerText = now.toLocaleDateString('ja-JP');

            // 外部API (Open-Meteo) から簡易的に天気を取得
            fetch('https://api.open-meteo.com/v1/forecast?latitude=36.4&longitude=138.25&current_weather=true')
                .then(response => response.json())
                .then(data => {
                    const weatherCode = data.current_weather.weathercode;
                    currentTemp = data.current_weather.temperature;
                    let weatherStr = "CLEAR";
                    currentWeatherJa = "晴れ";

                    if (weatherCode >= 51 && weatherCode <= 69) {
                        weatherStr = "RAIN";
                        currentWeatherJa = "雨";
                    } else if (weatherCode >= 71) {
                        weatherStr = "SNOW";
                        currentWeatherJa = "雪";
                    } else if (weatherCode >= 4 && weatherCode <= 50) {
                         weatherStr = "CLOUDY";
                         currentWeatherJa = "曇り";
                    }
                    
                    document.getElementById('weather-display').innerText = `WEATHER: ${weatherStr} / TEMP: ${currentTemp}°C`;
                }).catch(err => {
                    document.getElementById('weather-display').innerText = `WEATHER: OFFLINE`;
                });
        }

        // Wikipedia APIを使用して検索して解説する関数 ＆ 画面上タブに表示
        async function searchAndExplain(keyword) {
            speak(`データベースにアクセスし、「${keyword}」について検索します。`);
            
            // 画面上にWikipediaのページを読み込んで表示
            openTab(`https://ja.m.wikipedia.org/wiki/${encodeURIComponent(keyword)}`, `SEARCH: ${keyword}`);

            try {
                // Wikipedia API を叩いて概要を取得
                const url = `https://ja.wikipedia.org/w/api.php?format=json&action=query&prop=extracts&exintro&explaintext&redirects=1&titles=${encodeURIComponent(keyword)}&origin=*`;
                const response = await fetch(url);
                const data = await response.json();
                
                const pages = data.query.pages;
                const pageId = Object.keys(pages)[0];
                
                if (pageId === "-1") {
                    speak(`申し訳ありません、「${keyword}」に関する情報は見つかりませんでした。`);
                } else {
                    const extract = pages[pageId].extract;
                    const shortText = extract.substring(0, 150) + (extract.length > 150 ? "..." : "");
                    speak(shortText);
                }
            } catch (error) {
                speak('検索中にエラーが発生しました。ネットワーク接続を確認してください。');
            }
        }

        // 音声認識の待機
        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.continuous = true;
                recognition.interimResults = false;

                recognition.onstart = function() {
                    document.getElementById('mic-status').innerText = 'LISTENING...';
                    document.getElementById('mic-status').style.color = '#0f0';
                };

                recognition.onresult = function(event) {
                    const lastIndex = event.results.length - 1;
                    const transcript = event.results[lastIndex][0].transcript.trim();
                    
                    // 空文字や2文字未満の雑音は無視
                    if (!transcript || transcript.length < 2) {
                        return;
                    }

                    if (!isAwake) {
                        // スリープ中の起動コマンド判定
                        if (transcript.includes('起動') || transcript.includes('ジャーヴィス') || transcript.includes('ジャビス') || transcript.toLowerCase().includes('jarvis') || transcript.toLowerCase().includes('javis')) {
                            wakeUp();
                        }
                    } else {
                        // 起動後のコマンド処理
                        addLog(transcript);
                        processCommand(transcript);
                    }
                };

                recognition.onerror = function(event) {
                    console.log('Voice Recognition Error:', event.error);
                };

                recognition.onend = function() {
                    recognition.start();
                };

                recognition.start();
            } else {
                addLog('エラー: お使いのブラウザは音声認識をサポートしていません。', true);
            }
        }

        // コマンド処理
        function processCommand(command) {
            // --- カメラ切り替え機能 ---
            if (command.includes('アウトカメラ') || command.includes('背面カメラ') || command.includes('外のカメラ') || command.includes('外カメラ')) {
                speak('アウトカメラに切り替えます。右下にインカメラを表示します。');
                setupCamera('environment');
            } else if (command.includes('インカメラ') || command.includes('前面カメラ') || command.includes('内カメラ') || command.includes('元のカメラ')) {
                speak('インカメラに切り替えます。');
                setupCamera('user');
            } else if (command.includes('カメラ切り替え') || command.includes('カメラを切り替え') || command.includes('カメラ変えて')) {
                if (currentFacingMode === 'user') {
                    speak('アウトカメラに切り替えます。');
                    setupCamera('environment');
                } else {
                    speak('インカメラに切り替えます。');
                    setupCamera('user');
                }
            }

            // --- サイト・アプリを画面上タブで開く機能 ---
            else if (command.includes('YouTube') && (command.includes('開いて') || command.includes('見せて'))) {
                speak('画面上にYouTubeを表示します。');
                openTab('https://www.youtube.com', 'YouTube');
            } else if ((command.includes('Google') || command.includes('グーグル')) && command.includes('開いて')) {
                speak('画面上にGoogleを表示します。');
                openTab('https://www.google.com', 'Google');
            } else if ((command.includes('Twitter') || command.includes('X') || command.includes('エックス')) && command.includes('開いて')) {
                speak('画面上にXを表示します。');
                openTab('https://twitter.com', 'X');
            } 
            
            // --- タブの表示・非表示コントロール ---
            else if (command.includes('タブを表示') || command.includes('画面を表示') || command.includes('タブを開いて')) {
                speak('画面上にタブを表示しました。操作が可能です。');
                openTab(document.getElementById('tab-iframe').src || 'https://ja.m.wikipedia.org', 'DISPLAY TAB');
            } else if (command.includes('タブを消して') || command.includes('タブを閉じて') || command.includes('画面を閉じて')) {
                speak('タブを閉じました。');
                closeTab();
            }

            // --- 検索して解説・画面上タブ表示機能 ---
            else if (command.includes('について教えて') || command.includes('とは何') || command.includes('を検索して') || command.includes('を調べて') || command.includes('について調べて')) {
                let keyword = command.replace('について教えて', '').replace('について調べ', '').replace('について', '').replace('とは何', '').replace('とは', '').replace('を検索して', '').replace('検索して', '').replace('を調べて', '').replace('調べて', '').trim();
                if (keyword.endsWith('の')) keyword = keyword.slice(0, -1);
                
                if (keyword) {
                    searchAndExplain(keyword);
                } else {
                    speak('検索したいキーワードを聞き取れませんでした。もう一度お願いします。');
                }
            }

            // --- 会話・質問に答える機能 ---
            else if (command.includes('こんにちは') || command.includes('おはよう')) {
                speak('こんにちは、ボス。本日のシステムはすべて正常に稼働しています。');
            } else if (command.includes('ありがとう') || command.includes('サンキュー')) {
                speak('どういたしまして。お役に立てて光栄です。');
            } else if (command.includes('調子はどう') || command.includes('元気')) {
                speak('システムのパフォーマンスは100%、すべて順調です。');
            } else if (command.includes('誰が作った')) {
                speak('私は優秀な開発者であるあなたによってプログラムされました。');
            } else if (command.includes('今日何日') || command.includes('日付')) {
                const now = new Date();
                speak(`本日は${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日です。`);
            } else if (command.includes('時間') || command.includes('何時')) {
                const now = new Date();
                speak(`現在の時刻は${now.getHours()}時${now.getMinutes()}分です。`);
            } else if (command.includes('天気')) {
                if (currentWeatherJa !== "不明") {
                    speak(`現在の天気は${currentWeatherJa}、気温は${currentTemp}度です。`);
                } else {
                     speak('申し訳ありません。現在、天気の情報を取得できていません。');
                }
            } else if (command.includes('スキャン')) {
                speak('周囲の環境をスキャンしています... 脅威は検出されませんでした。');
                document.getElementById('target-reticle').style.borderColor = '#0f0';
                setTimeout(() => document.getElementById('target-reticle').style.borderColor = '#0ff', 3000);
            } 
            
            // --- シャットダウン ---
            else if (command.includes('終了') || command.includes('シャットダウン') || command.includes('スリープ')) {
                speak('システムをスリープ状態に移行します。おやすみなさいませ、ボス。');
                isAwake = false;
                closeTab();
                
                // 目を閉じる
                document.getElementById('eye-top').style.height = '50vh';
                document.getElementById('eye-bottom').style.height = '50vh';
                
                // カメラ停止
                stopAllCameras();
                document.getElementById('cam-status').innerText = 'OFF';
                document.getElementById('cam-status').style.color = '#0ff';
                setTimeout(() => addLog("システムはスリープ状態です。「起動」または「ジャーヴィス」と話しかけてください。"), 1000);
            } else {
                speak('すみません、そのコマンドに対する回答がデータベースにありません。');
            }
        }
    </script>
</body>
</html>
